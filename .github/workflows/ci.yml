
name: CI

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          build: true
      - name: Append-only check (PR only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          bash scripts/check_append_only.sh
