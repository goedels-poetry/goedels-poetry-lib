name: Enforce Branch Protection (build required)

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  pull-requests: read
  metadata: read
  administration: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch protection for main
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GH_REPO}/branches/main/protection"
          echo "Fetching branch protection from: $api"
          response=$(curl -s -w "%{http_code}" -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "$api")
          # Split payload and status
          status="${response: -3}"
          body="${response::-3}"
          if [ "$status" != "200" ]; then
            echo "ERROR: Failed to read branch protection (status $status)."
            echo "Body:"
            echo "$body"
            exit 1
          fi

          export BODY="$body"
          python3 - <<'PY'
import json, sys, os
body = json.loads(os.environ["BODY"])
req = body.get("required_status_checks") or {}
contexts = req.get("contexts") or []

if "build" not in contexts:
    print("ERROR: Branch protection for main does not require the 'build' check.")
    print(f"Current required contexts: {contexts}")
    sys.exit(1)

print("Confirmed: branch protection requires 'build' status check on main.")
PY

