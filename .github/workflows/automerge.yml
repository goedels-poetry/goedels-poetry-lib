
name: CI and Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install elan
        uses: leanprover/lean-action@v1
        with:
          build: false

      - name: Validate branch name
        # Only enforce branch name pattern when adding theorem files
        # Maintenance/workflow changes can use any branch name
        run: |
          branch_name="${{ github.head_ref }}"
          # Check if any theorem files (non-Init.lean) are being added
          new_theorem_files=$(git diff --name-only --diff-filter=A origin/main -- "*.lean" 2>/dev/null | grep -v "Init.lean$" || echo "")
          
          if [ -n "$new_theorem_files" ]; then
            # If adding theorem files, branch name must follow pattern
            if [[ ! "$branch_name" =~ ^add-theorem- ]]; then
              echo "ERROR: Branch name must start with 'add-theorem-' when adding theorem files"
              echo "Found: $branch_name"
              echo "Theorem files being added:"
              echo "$new_theorem_files"
              exit 1
            fi
          else
            # No theorem files being added, allow any branch name (for maintenance/workflow changes)
            echo "No theorem files detected, branch name validation skipped (maintenance/workflow changes allowed)"
          fi

      - name: Validate file paths
        # Only enforce file path restrictions when adding theorem files
        # Maintenance/workflow changes can modify any files
        run: |
          changed_files=$(git diff --name-only origin/main || echo "")
          if [ -z "$changed_files" ]; then
            echo "No changes detected"
            exit 0
          fi
          
          # Check if any theorem files (non-Init.lean) are being added
          new_theorem_files=$(git diff --name-only --diff-filter=A origin/main -- "*.lean" 2>/dev/null | grep -v "Init.lean$" || echo "")
          
          if [ -z "$new_theorem_files" ]; then
            # No theorem files being added, skip strict file path validation (maintenance mode)
            echo "No theorem files detected, file path validation skipped (maintenance/workflow changes allowed)"
            exit 0
          fi
          
          # Theorem files being added, enforce strict file path validation
          for file in $changed_files; do
            # Allow Init.lean files (will be regenerated by CI)
            # Pattern: GoedelsPoetryLib/.../Init.lean (any nesting level)
            if [[ "$file" =~ ^GoedelsPoetryLib/.*/Init\.lean$ ]]; then
              continue
            fi
            # Require .lean files in GoedelsPoetryLib/<category>/.../<filename>.lean pattern
            # Supports nested subdirectories: GoedelsPoetryLib/<category>/<subcategory>/.../<filename>.lean
            if [[ "$file" == *.lean ]]; then
              # Pattern: GoedelsPoetryLib/ followed by one or more directory levels, then filename.lean
              if [[ ! "$file" =~ ^GoedelsPoetryLib/([^/]+/)+[^/]+\.lean$ ]]; then
                echo "ERROR: Invalid file path: $file"
                echo "Only .lean files in GoedelsPoetryLib/<category>/.../<filename>.lean are allowed"
                echo "Supports nested subdirectories: GoedelsPoetryLib/Logic/SetTheory/Commutativity.lean"
                exit 1
              fi
            else
              echo "ERROR: Non-.lean file detected: $file"
              echo "Only .lean files are allowed in theorem addition PRs"
              exit 1
            fi
          done

      - name: Block changes to critical files
        # Only enforce critical file protection when adding theorem files
        # Maintenance/workflow changes can modify protected files
        run: |
          changed_files=$(git diff --name-only origin/main || echo "")
          if [ -z "$changed_files" ]; then
            exit 0
          fi
          
          # Check if any theorem files (non-Init.lean) are being added
          new_theorem_files=$(git diff --name-only --diff-filter=A origin/main -- "*.lean" 2>/dev/null | grep -v "Init.lean$" || echo "")
          
          if [ -z "$new_theorem_files" ]; then
            # No theorem files being added, skip critical file protection (maintenance mode)
            echo "No theorem files detected, critical file protection skipped (maintenance/workflow changes allowed)"
            exit 0
          fi
          
          # Theorem files being added, enforce critical file protection
          blocked_patterns=(
            "scripts/"
            ".github/"
            "lakefile.lean"
            "lean-toolchain"
            ".gitignore"
            "README.md"
            "CONTRIBUTING.md"
            "LICENSE"
            "GoedelsPoetryLib/Init.lean"
          )
          
          for file in $changed_files; do
            for pattern in "${blocked_patterns[@]}"; do
              if [[ "$file" == "$pattern"* ]] || [[ "$file" == "$pattern" ]]; then
                echo "ERROR: Modification to protected file/directory: $file"
                echo "Protected pattern: $pattern"
                echo "Protected files cannot be modified in theorem addition PRs"
                exit 1
              fi
            done
          done

      - name: Validate one file per PR
        # Only enforce one-file-per-PR when adding theorem files
        # Maintenance/workflow changes can modify multiple files
        run: |
          new_files=$(git diff --name-only --diff-filter=A origin/main -- "*.lean" 2>/dev/null | grep -v "Init.lean$" || echo "")
          
          if [ -z "$new_files" ]; then
            # No theorem files being added, skip one-file validation (maintenance mode)
            echo "No theorem files detected, one-file-per-PR validation skipped (maintenance/workflow changes allowed)"
            exit 0
          fi
          
          # Theorem files being added, enforce one-file-per-PR rule
          file_count=$(echo "$new_files" | grep -c . || echo "0")
          if [ "$file_count" -gt 1 ]; then
            echo "ERROR: PR must add exactly one theorem file, found $file_count"
            echo "Files:"
            echo "$new_files"
            exit 1
          fi
          
          echo "Validated: PR adds exactly one theorem file"

      - name: Lake build
        run: lake build

      - name: Lake build tests
        run: lake build Tests

      - name: Fetch origin/main for append-only check
        run: git fetch origin main

      - name: Append-only check
        run: bash scripts/check_append_only.sh

      - name: Regenerate init files
        run: python3 scripts/regenerate_init.py

      - name: Commit regenerated init files if changed
        # We run regenerate_init.py during PR validation (not post-merge) so that:
        # 1. The Init.lean files are part of the PR being validated
        # 2. The build can verify the generated Init.lean files compile correctly
        # 3. All changes are committed together in the PR
        # 4. If push fails, the PR fails (preventing invalid repository state)
        run: |
          if ! git diff --quiet GoedelsPoetryLib/**/Init.lean 2>/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add GoedelsPoetryLib/**/Init.lean
            git commit -m "chore: regenerate Init.lean files"
            # If push fails, fail the build to prevent merging an invalid state
            # (theorem added without Init.lean update)
            git push || (echo "ERROR: Failed to push Init.lean changes. PR cannot merge in invalid state." && exit 1)
          fi

      - name: Validate regenerated Init.lean files compile
        # Rebuild after Init.lean regeneration to ensure generated files are valid
        run: |
          lake build
          lake build Tests

      - name: Ensure working tree clean (excluding Init.lean files)
        run: |
          # Allow Init.lean changes, but check for any other unexpected changes
          git diff --name-only | grep -v "Init.lean$" | grep -q . && exit 1 || exit 0

  automerge:
    # This job depends on the build job completing successfully.
    # If the build job fails, this job will not run (due to needs: build).
    needs: build
    if: github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            // mergeable_state === 'clean' means GitHub considers the PR mergeable,
            // but this doesn't explicitly verify that required status checks passed.
            // 
            // Safety mechanisms:
            // 1. The 'needs: build' dependency ensures this job only runs if build succeeded
            // 2. GitHub branch protection should be configured to require the 'build' check
            //    to pass before allowing merges. This provides an additional safety layer.
            //
            // If branch protection is not configured, consider adding an explicit check:
            // const checks = await github.rest.checks.listForRef({
            //   owner: context.repo.owner,
            //   repo: context.repo.repo,
            //   ref: pr.head.sha
            // });
            // const buildCheck = checks.data.check_runs.find(c => c.name === 'build');
            // if (buildCheck?.conclusion !== 'success') { ... }
            
            if (pr.mergeable_state === 'clean') {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: "squash"
              });
            } else {
              console.log(`PR ${pr.number} not mergeable. State: ${pr.mergeable_state}`);
            }
